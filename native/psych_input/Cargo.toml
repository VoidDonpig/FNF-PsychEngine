[package]
name = "psych_input"
version = "0.1.0"
edition = "2021"
description = "Raw Input keyboard capture, DXGI flip-model presentation and window setup for Psych Engine (Windows)"

[lib]
# staticlib: linked into the Haxe (hxcpp) build. rlib: used as a normal dependency by the Rust engine (engine-rs).
crate-type = ["staticlib", "rlib"]
# The plain library cannot be built for a test run (no_std with the unwinding test profile), and it has no doc tests.
doctest = false

[features]
# For Rust programs that link the standard library: they bring their own panic handler.
std = []

# no_std + abort: nothing but kernel32/user32 to link into the hxcpp executable.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1

# Only for the tests: checks the hand-written COM layouts in src/present.rs against the official bindings.
[dev-dependencies]
windows = { version = "0.58", features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Graphics_OpenGL"] }
