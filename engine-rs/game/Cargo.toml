[package]
name = "funkin"
version = "0.1.0"
edition = "2021"
description = "The game: window, drawing, audio and input around funkin_core."

[features]
default = ["audio"]
# Sound output. Off, songs run silently on the system clock (machines without an audio stack).
audio = ["dep:cpal", "dep:lewton"]

[dependencies]
funkin_core = { path = "../core" }
cpal = { version = "0.15", optional = true }
lewton = { version = "0.10", optional = true }
# (preserve_order: files the editors save keep their keys where they were)
serde_json = { version = "1", features = ["preserve_order"] }
# Drawing, on Vulkan, DirectX 12 or OpenGL (the "Graphics API" option); the window and keyboard; letters from font files; picture files.
wgpu = "30"
winit = "0.30"
fontdue = "0.9"
png = "0.17"
glam = "0.27"
pollster = "0.4"
bytemuck = "1"
psych_input = { path = "../../native/psych_input", features = ["std"] }
# Videos: mp4 files, their H.264 pictures (OpenH264, built from source) and AAC sound.
mp4 = "0.14.0"
openh264 = "0.9.10"
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "isomp4"] }
mlua = { version = "0.12.2", features = ["lua54", "vendored"] }

[build-dependencies]
# The .exe's icon, name and version, and its manifest (Windows resources; build.rs)
embed-resource = "3.0.12"

[target."cfg(windows)".dependencies]
gilrs = "0.11.2"
